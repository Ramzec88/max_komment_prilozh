<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Комментарии — Мишка Макс</title>
<script src="https://st.max.ru/js/max-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Nunito+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bear:       #C25C2A;
    --bear-l:     #E07A47;
    --bear-d:     #9B4420;
    --amber:      #F0A830;
    --cream:      #FDF8F2;
    --surface:    #FFFFFF;
    --surface-2:  #FFF4EA;
    --border:     #EFD9C5;
    --text:       #2A1A0A;
    --text-2:     #7A5C40;
    --text-3:     #B09070;
    --mine-bg:    #E87840;
    --mine-text:  #FFFFFF;
    --other-bg:   #FFFFFF;
    --other-text: #2A1A0A;
    --shadow:     0 2px 10px rgba(194,92,42,.10);
    --r:          18px;
    --r-sm:       12px;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html { height:100%; }

  body {
    font-family: 'Nunito Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ─── ШАПКА ─── */
  .header {
    background: var(--surface);
    border-bottom: 1.5px solid var(--border);
    padding: 12px 16px 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-back {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .header-back:active { background: var(--border); }

  .header-info { flex: 1; min-width: 0; }

  .header-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 14px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .header-sub {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-3);
    margin-top: 1px;
  }

  .header-bear {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--bear-l), var(--bear-d));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 2px 8px rgba(194,92,42,.28);
    flex-shrink: 0;
  }

  /* ─── СПИСОК СООБЩЕНИЙ ─── */
  .messages-wrap {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* Дата-разделитель */
  .date-divider {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 6px 0 4px;
  }
  .date-divider::before, .date-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .date-divider-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-3);
    font-family: 'Nunito', sans-serif;
  }

  /* Строка сообщения */
  .msg-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    animation: pop 0.2s ease;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.mine {
    flex-direction: row-reverse;
  }

  .msg-row.mine + .msg-row.mine .avatar,
  .msg-row.other + .msg-row.other .avatar {
    visibility: hidden;
  }

  /* Аватар */
  .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 13px;
    color: white;
    background: linear-gradient(135deg, var(--amber), var(--bear));
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
  }

  /* Пузырь */
  .bubble {
    max-width: calc(100% - 80px);
    padding: 9px 13px;
    border-radius: var(--r);
    position: relative;
  }

  .msg-row.other .bubble {
    background: var(--other-bg);
    color: var(--other-text);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
  }

  .msg-row.mine .bubble {
    background: linear-gradient(135deg, var(--bear-l) 0%, var(--bear) 100%);
    color: var(--mine-text);
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 10px rgba(194,92,42,.3);
  }

  .bubble-author {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 11px;
    margin-bottom: 2px;
    opacity: 0.85;
  }

  .msg-row.mine .bubble-author { display: none; }

  .bubble-text {
    font-size: 14px;
    line-height: 1.45;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .bubble-time {
    font-size: 10px;
    margin-top: 3px;
    text-align: right;
    opacity: 0.65;
    font-weight: 600;
  }

  /* Кнопка удаления (свои / admin) */
  .bubble-delete {
    position: absolute;
    top: 4px; right: 4px;
    width: 18px; height: 18px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,.15);
    color: white;
    font-size: 10px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .bubble:hover .bubble-delete { display: flex; }

  /* ─── ПУСТОЕ СОСТОЯНИЕ ─── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 40px 24px;
    text-align: center;
  }
  .empty-icon { font-size: 48px; }
  .empty-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: var(--text-2);
  }
  .empty-sub { font-size: 13px; color: var(--text-3); line-height: 1.5; }

  /* ─── ЗАГРУЗКА ─── */
  .loader {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 40px;
    font-size: 13px;
    color: var(--text-3);
    font-weight: 600;
    font-family: 'Nunito', sans-serif;
  }
  .spin {
    width: 20px; height: 20px;
    border: 2.5px solid var(--border);
    border-top-color: var(--bear);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── ФОРМА ВВОДА ─── */
  .input-bar {
    background: var(--surface);
    border-top: 1.5px solid var(--border);
    padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex;
    align-items: flex-end;
    gap: 8px;
    flex-shrink: 0;
  }

  .input-wrap {
    flex: 1;
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    display: flex;
    align-items: flex-end;
    padding: 8px 14px;
    gap: 8px;
    transition: border-color 0.2s;
  }

  .input-wrap:focus-within { border-color: var(--bear-l); }

  .input-field {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-family: 'Nunito Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    resize: none;
    max-height: 100px;
    overflow-y: auto;
    line-height: 1.45;
    min-height: 20px;
  }

  .input-field::placeholder { color: var(--text-3); }

  .send-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--bear-l), var(--bear));
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(194,92,42,.35);
    transition: all 0.15s;
  }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ─── ОШИБКА ─── */
  .error-bar {
    background: #FDEAEA;
    border-top: 1.5px solid #FACFCF;
    padding: 10px 16px;
    font-size: 13px;
    color: #C04040;
    text-align: center;
    font-weight: 600;
    display: none;
  }
  .error-bar.show { display: block; }

  /* ─── ТОСТ ─── */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--text);
    color: white;
    padding: 9px 18px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Nunito', sans-serif;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ШАПКА -->
<div class="header">
  <div class="header-back" onclick="window.WebApp?.close()">←</div>
  <div class="header-info">
    <div class="header-title" id="postTitle">Комментарии</div>
    <div class="header-sub" id="commentCount">загрузка...</div>
  </div>
  <div class="header-bear">🐻</div>
</div>

<!-- СПИСОК -->
<div class="messages-wrap" id="messagesList">
  <div class="loader"><div class="spin"></div> Загружаем...</div>
</div>

<!-- ОШИБКА -->
<div class="error-bar" id="errorBar"></div>

<!-- ФОРМА -->
<div class="input-bar">
  <div class="input-wrap">
    <textarea
      class="input-field"
      id="inputField"
      placeholder="Написать комментарий..."
      rows="1"
      maxlength="1000"
    ></textarea>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendComment()" disabled>➤</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── КОНФИГ ─────────────────────────────────
const API_BASE   = 'https://YOUR-BACKEND.railway.app'; // ← заменить
const ADMIN_ID   = 'YOUR_MAX_USER_ID';                 // ← заменить

// ─── СТЕЙТ ──────────────────────────────────
let initData    = '';
let currentUser = null;
let isAdmin     = false;
let messageId   = null;   // message_id поста из канала
let isSending   = false;

// ─── INIT ────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  window.WebApp?.ready();

  initData    = window.WebApp?.initData || '';
  currentUser = window.WebApp?.initDataUnsafe?.user || { id: 0, first_name: 'Пользователь' };
  isAdmin     = String(currentUser.id) === String(ADMIN_ID);

  // Получаем message_id из start_param (формат: "post_<messageId>")
  const startParam = window.WebApp?.initDataUnsafe?.start_param || '';
  const match = startParam.match(/^post_(.+)$/);

  if (!match) {
    showError('Пост не найден. Попробуйте открыть заново.');
    return;
  }

  messageId = match[1];

  // Настраиваем кнопку «Назад» в шапке MAX
  window.WebApp?.BackButton?.show();
  window.WebApp?.BackButton?.onClick(() => window.WebApp?.close());

  // Загружаем
  await loadPost();
  await loadComments();

  // Автоскролл вниз при открытии клавиатуры
  window.visualViewport?.addEventListener('resize', scrollToBottom);
});

// ─── API ─────────────────────────────────────
async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'x-init-data': initData,
      ...(opts.headers || {}),
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error || `HTTP ${res.status}`);
  }
  return res.json();
}

// ─── ЗАГРУЗКА ПОСТА ──────────────────────────
async function loadPost() {
  try {
    const post = await api(`/api/post/${messageId}`);
    document.getElementById('postTitle').textContent =
      post.title ? truncate(post.title, 42) : 'Комментарии';
    updateCountLabel(post.comment_count || 0);
  } catch {
    document.getElementById('postTitle').textContent = 'Комментарии';
  }
}

// ─── ЗАГРУЗКА КОММЕНТАРИЕВ ───────────────────
async function loadComments() {
  const list = document.getElementById('messagesList');
  list.innerHTML = '<div class="loader"><div class="spin"></div> Загружаем...</div>';

  try {
    const comments = await api(`/api/post/${messageId}/comments`);
    renderComments(comments);
  } catch (err) {
    list.innerHTML = '';
    showError('Не удалось загрузить комментарии: ' + err.message);
  }
}

// ─── РЕНДЕР ──────────────────────────────────
function renderComments(comments) {
  const list = document.getElementById('messagesList');
  list.innerHTML = '';

  if (!comments.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">💬</div>
        <div class="empty-title">Комментариев пока нет</div>
        <div class="empty-sub">Будь первым! Напишите своё мнение ниже.</div>
      </div>`;
    return;
  }

  let lastDate = null;

  comments.forEach(c => {
    const isMine = String(c.user_id) === String(currentUser?.id);
    const date = new Date(c.created_at);
    const dateKey = date.toDateString();

    // Разделитель по датам
    if (dateKey !== lastDate) {
      lastDate = dateKey;
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.innerHTML = `<span class="date-divider-label">${formatDateLabel(date)}</span>`;
      list.appendChild(div);
    }

    list.appendChild(buildBubble(c, isMine));
  });

  scrollToBottom();
}

function buildBubble(c, isMine) {
  const canDelete = isMine || isAdmin;
  const initials = (c.first_name || '?').charAt(0).toUpperCase();
  const time = new Date(c.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

  const row = document.createElement('div');
  row.className = `msg-row ${isMine ? 'mine' : 'other'}`;
  row.dataset.id = c.id;

  row.innerHTML = `
    <div class="avatar" title="${esc(c.first_name)}">${initials}</div>
    <div class="bubble">
      ${!isMine ? `<div class="bubble-author">${esc(c.first_name)}${c.username ? ' @' + esc(c.username) : ''}</div>` : ''}
      <div class="bubble-text">${esc(c.text)}</div>
      <div class="bubble-time">${time}</div>
      ${canDelete ? `<button class="bubble-delete" onclick="deleteComment('${c.id}', this)" title="Удалить">✕</button>` : ''}
    </div>
  `;
  return row;
}

// ─── ОТПРАВКА ────────────────────────────────
const inputField = document.getElementById('inputField');
const sendBtn    = document.getElementById('sendBtn');

inputField.addEventListener('input', function () {
  // Авторесайз
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  sendBtn.disabled = !this.value.trim();
});

inputField.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) sendComment();
  }
});

async function sendComment() {
  const text = inputField.value.trim();
  if (!text || isSending) return;

  isSending = true;
  sendBtn.disabled = true;

  try {
    const comment = await api(`/api/post/${messageId}/comments`, {
      method: 'POST',
      body: { text },
    });

    // Добавляем пузырь без перезагрузки
    const list = document.getElementById('messagesList');

    // Убираем empty-state если был
    const empty = list.querySelector('.empty-state');
    if (empty) list.innerHTML = '';

    // Дата-разделитель если нужен
    const now = new Date();
    const lastDivider = list.querySelector('.date-divider:last-of-type .date-divider-label');
    const lastDateStr = lastDivider?.textContent || '';
    const todayStr = formatDateLabel(now);
    if (lastDateStr !== todayStr) {
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.innerHTML = `<span class="date-divider-label">${todayStr}</span>`;
      list.appendChild(div);
    }

    list.appendChild(buildBubble(comment, true));

    inputField.value = '';
    inputField.style.height = 'auto';

    // Обновляем счётчик
    const post = await api(`/api/post/${messageId}`);
    updateCountLabel(post.comment_count);

    window.WebApp?.HapticFeedback?.notificationOccurred('success');
    scrollToBottom();

  } catch (err) {
    showToast('❌ ' + err.message);
  } finally {
    isSending = false;
    sendBtn.disabled = !inputField.value.trim();
  }
}

// ─── УДАЛЕНИЕ ────────────────────────────────
async function deleteComment(id, btn) {
  if (!confirm('Удалить комментарий?')) return;

  btn.textContent = '…';
  try {
    await api(`/api/comments/${id}`, { method: 'DELETE' });

    // Удаляем пузырь из DOM
    const row = document.querySelector(`[data-id="${id}"]`);
    if (row) {
      row.style.opacity = '0';
      row.style.transform = 'scale(0.95)';
      row.style.transition = 'all 0.2s';
      setTimeout(() => row.remove(), 200);
    }

    const post = await api(`/api/post/${messageId}`);
    updateCountLabel(post.comment_count);

    window.WebApp?.HapticFeedback?.notificationOccurred('success');
    showToast('Удалено');
  } catch (err) {
    showToast('❌ ' + err.message);
    btn.textContent = '✕';
  }
}

// ─── UTILS ───────────────────────────────────
function updateCountLabel(count) {
  const s = count === 0 ? 'Нет комментариев'
    : count === 1 ? '1 комментарий'
    : (count >= 2 && count <= 4) ? `${count} комментария`
    : `${count} комментариев`;
  document.getElementById('commentCount').textContent = s;
}

function scrollToBottom() {
  const list = document.getElementById('messagesList');
  list.scrollTop = list.scrollHeight;
}

function esc(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/\n/g, '<br>');
}

function truncate(str, n) {
  return str.length > n ? str.slice(0, n) + '…' : str;
}

function formatDateLabel(date) {
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);

  if (date.toDateString() === today.toDateString()) return 'Сегодня';
  if (date.toDateString() === yesterday.toDateString()) return 'Вчера';
  return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}

function showError(msg) {
  const bar = document.getElementById('errorBar');
  bar.textContent = msg;
  bar.classList.add('show');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
